<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno</title>
<meta name="description" content="Apuntes, horario y calendario para clase.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuaderno">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
// Apply the chosen theme and font before anything is painted (js/theme.js takes over afterwards).
try {
  var t = localStorage.getItem('cuaderno:theme');
  if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'white';
  document.documentElement.dataset.theme = t === 'beige' || t === 'dark' ? t : 'white';
  var f = localStorage.getItem('cuaderno:font');
  if (/^[a-z]+$/.test(f || '')) document.documentElement.dataset.font = f;
} catch (e) { document.documentElement.dataset.theme = 'white'; }
</script>
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
